[pytest]
addopts = -p no:cacheprovider -m "not integration"
markers =
    integration: tests that require external services or side-effecting integrations; skipped by default
    exchange_demo: tests that may place demo/live exchange orders; require RUN_EXCHANGE_TESTS=1
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated and scheduled for removal in a future version\.:DeprecationWarning:okx\.utils
